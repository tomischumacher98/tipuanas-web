[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

# CSS y JS: se revalidan siempre. Como los nombres de archivo no llevan
# huella (hash), el navegador tiene que preguntar si cambiaron. La respuesta
# suele ser un 304 vacio, asi que el costo es minimo.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Imagenes: se cachean un dia. Siguen siendo rapidas para quien vuelve,
# y si reemplazas una foto conservando el nombre se actualiza sola.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Redirects para mantener URLs legacy de Wix
[[redirects]]
  from = "/productos-1"
  to = "/productos/"
  status = 301

